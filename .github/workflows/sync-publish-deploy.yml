name: Sync Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Upstream Sync
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-publish-deploy
  cancel-in-progress: false

jobs:
  sync-publish-deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge main into publish
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main publish

          if git merge-base --is-ancestor origin/main origin/publish; then
            echo "publish already contains main; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B publish origin/publish

          # publish owns the Cloudflare deployment config. Never replace it with upstream/main.
          cp wrangler.toml "$RUNNER_TEMP/wrangler.toml"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          cp "$RUNNER_TEMP/wrangler.toml" wrangler.toml
          git add wrangler.toml

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Unresolved merge conflicts remain:"
            echo "$conflicts"
            git merge --abort || true
            exit 1
          fi

          if [ "$merge_status" -ne 0 ] && [ ! -f .git/MERGE_HEAD ]; then
            echo "Merge failed before a merge state was created."
            exit "$merge_status"
          fi

          git commit -m "chore: sync main into publish"
          git push origin publish
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloudflare Worker
        if: steps.sync.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
